name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: "0 2 * * *"

jobs:
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./publisher-backend

      - name: Check backend vulnerabilities (production dependencies)
        run: npm audit --production --audit-level=moderate || true
        working-directory: ./publisher-backend

      - name: Check backend build-time vulnerabilities (informational)
        run: npm audit || true
        working-directory: ./publisher-backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./reader-app

      - name: Check frontend vulnerabilities
        run: npm audit --omit=dev || true
        working-directory: ./reader-app

      - name: Install SDK dependencies
        run: npm ci
        working-directory: ./publisher-sdk

      - name: Check SDK vulnerabilities
        run: npm audit --omit=dev || true
        working-directory: ./publisher-sdk

  # Note: CodeQL and container scanning are disabled for MVP
  # These can be enabled and configured once the project reaches production-readiness
